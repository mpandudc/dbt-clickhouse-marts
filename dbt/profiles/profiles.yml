clickhouse_marts:
  target: local
  outputs:
    local:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_HTTP_PORT', '18123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'dbt') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'dbt') }}"
      schema: analytics
      driver: http
      secure: false
      threads: 4
      connect_timeout: 10
      send_receive_timeout: 300
      # Mutations from delete+insert must finish before the next statement.
      custom_settings:
        mutations_sync: 2
