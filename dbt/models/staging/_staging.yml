version: 2

models:
  - name: stg_assets
    description: Asset master with normalised casing.
    columns:
      - name: asset_id
        data_tests: [unique, not_null]
      - name: asset_class
        data_tests:
          - accepted_values:
              arguments:
                values: [crypto, idx_equity]
      - name: quote_ccy
        data_tests:
          - accepted_values:
              arguments:
                values: [USDT, IDR]

  - name: stg_prices
    description: One close per asset per trading day.
    data_tests:
      - unique_combination:
          arguments:
            columns: [asset_id, price_date]
    columns:
      - name: close
        data_tests: [not_null, non_negative]

  - name: stg_trades
    description: Deduplicated executions with signed quantity and cash flow.
    columns:
      - name: trade_id
        data_tests: [unique, not_null]
      - name: side
        data_tests:
          - accepted_values:
              arguments:
                values: [buy, sell]
      - name: asset_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_assets')
                field: asset_id
      - name: quantity
        data_tests: [non_negative]
      - name: fee
        data_tests: [non_negative]

unit_tests:
  - name: stg_trades_keeps_first_delivery_and_signs_cash
    model: stg_trades
    given:
      - input: source('raw', 'trades')
        rows:
          - {trade_id: t1, account_id: a, asset_id: "CRYPTO:BTC", side: BUY, quantity: 2, price: 100, fee: 1, executed_at: "2026-01-01 00:00:00", trade_date: "2026-01-01", ingested_at: "2026-01-01 00:00:01"}
          - {trade_id: t1, account_id: a, asset_id: "CRYPTO:BTC", side: BUY, quantity: 2, price: 100, fee: 1, executed_at: "2026-01-01 00:00:00", trade_date: "2026-01-01", ingested_at: "2026-01-01 01:00:00"}
          - {trade_id: t2, account_id: a, asset_id: "crypto:btc", side: sell, quantity: 1, price: 110, fee: 1, executed_at: "2026-01-01 02:00:00", trade_date: "2026-01-01", ingested_at: "2026-01-01 02:00:01"}
    expect:
      rows:
        - {trade_id: t1, asset_id: "crypto:btc", side: buy, signed_quantity: 2, cash_flow: -201}
        - {trade_id: t2, asset_id: "crypto:btc", side: sell, signed_quantity: -1, cash_flow: 109}
