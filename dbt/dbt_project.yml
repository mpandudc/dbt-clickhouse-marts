name: clickhouse_marts
version: "1.0.0"
config-version: 2
profile: clickhouse_marts

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # How many days the incremental fact re-reads to absorb late re-deliveries.
  lookback_days: 3

models:
  clickhouse_marts:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

data_tests:
  clickhouse_marts:
    +severity: error
