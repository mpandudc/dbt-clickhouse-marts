name: dbt-clickhouse-marts

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true

services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-26.8}
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dbt}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dbt}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-18123}:8123"
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 1500m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    <<: *common-security

  dbt:
    build: .
    image: local/dbt-clickhouse-marts:1.0
    profiles: [tools]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dbt}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dbt}
      DBT_PROFILES_DIR: /app/dbt/profiles
    working_dir: /app/dbt
    volumes:
      - ./:/app
    mem_limit: 768m
    <<: *common-security

  # Web UI: dbt docs site (lineage graph, model and column docs, test coverage).
  docs:
    image: local/dbt-clickhouse-marts:1.0
    profiles: [docs]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dbt}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dbt}
      DBT_PROFILES_DIR: /app/dbt/profiles
    working_dir: /app/dbt
    volumes:
      - ./:/app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - dbt docs generate --target-path /tmp/docs && dbt docs serve --target-path /tmp/docs --host 0.0.0.0 --port 8080 --no-browser
    ports:
      - "${DOCS_PORT:-18090}:8080"
    mem_limit: 512m
    <<: *common-security

volumes:
  clickhouse-data:
